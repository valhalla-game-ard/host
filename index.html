<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALHALLA Console Clinic</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            /* تنظیم عکس به عنوان پس‌زمینه کامل */
            background: #000 url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* تنظیم فاصله عناصر در بالا و پایین */
            align-items: flex-end; /* هدایت کادرها به سمت راست جهت جلوگیری از افتادن روی چهره ثور */
        }

        /* باکس پیام وضعیت کپی‌خور در پایین سمت راست */
        .status-container {
            background: rgba(13, 15, 18, 0.85);
            border: 1px solid #c5a059;
            border-radius: 8px;
            padding: 12px 20px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(4px);
        }

        .status-title {
            color: #c5a059;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .status-msg {
            color: #00ffcc;
            font-size: 15px;
            font-weight: 500;
        }

        /* راهنمای مختصر و خلوت گوشه بالا سمت راست */
        .info-badge {
            background: rgba(0, 0, 0, 0.6);
            border-right: 3px solid #c5a059;
            padding: 8px 15px;
            border-radius: 4px;
            font-size: 12px;
            color: #d0d7de;
            line-height: 1.6;
            max-width: 320px;
        }
    </style>
</head>
<body>

    <!-- راهنمای خلوت بالا سمت راست (تاریکی کوهستان) -->
    <div class="info-badge">
        • در صورت بروز خطا، کنسول را ری‌استارت کنید.<br>
        • بدون نیاز به فلش برای فریمورهای ۶.۰۰ تا ۱۱.۰۲
    </div>

    <!-- کادر اصلی وضعیت لود جیلبریک/گلدهن در پایین سمت راست -->
    <div class="status-container">
        <div class="status-title">STATUS</div>
        <div class="status-msg" id="msgs">Awaiting Jailbreak...</div>
    </div>

</body>
</html>
