<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALHALLA Console Clinic</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            /* تنظیم عکس به عنوان پس‌زمینه کامل */
            background: #000 url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 30px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
        }

        /* باکس پیام وضعیت کپی‌خور - سایز بزرگ و خوانا */
        .status-container {
            background: rgba(13, 15, 18, 0.9);
            border: 2px solid #c5a059;
            border-radius: 12px;
            padding: 18px 25px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(6px);
        }

        .status-title {
            color: #c5a059;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .status-msg {
            color: #00ffcc;
            font-size: 20px;
            font-weight: bold;
        }

        /* راهنمای بالا سمت راست - درشت و کاملاً واضح روی تلویزیون */
        .info-badge {
            background: rgba(0, 0, 0, 0.75);
            border-right: 5px solid #c5a059;
            padding: 15px 22px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            color: #f0f6fc;
            line-height: 1.8;
            max-width: 400px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <!-- راهنمای درشت بالا سمت راست -->
    <div class="info-badge">
        • در صورت بروز خطا، کنسول را ری‌استارت کنید.<br>
        • بدون نیاز به فلش برای فریمورهای ۶.۰۰ تا ۱۱.۰۲
    </div>

    <!-- کادر وضعیت لود جیلبریک/گلدهن در پایین سمت راست -->
    <div class="status-container">
        <div class="status-title">STATUS</div>
        <div class="status-msg" id="msgs">Awaiting Jailbreak...</div>
    </div>

</body>
</html>
